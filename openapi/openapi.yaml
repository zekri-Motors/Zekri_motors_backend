    parameters: [{ name: setting, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Settings], summary: Show setting, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    put: &settingUpdate
      tags: [Settings]
      summary: Update setting value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: { value: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    patch: *settingUpdate
    delete: { tags: [Settings], summary: Delete setting, responses: { '200': { $ref: '#/components/responses/Deleted' } } }
  /pre-order-cars:
    get:
      tags: [PreOrderCars]
      summary: List pre-order cars (public — no auth required)
      security: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending] }, description: "draft = مسودة | pending = منشورة" }
        - { name: supplier_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [PreOrderCars]
      summary: Create pre-order car draft (staff only)
      requestBody: { $ref: '#/components/requestBodies/JsonPreOrderCar' }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /pre-order-cars/import:
    post:
      tags: [PreOrderCars]
      summary: Import pre-order cars from xlsx/xls/csv (staff only)
      requestBody: { $ref: '#/components/requestBodies/PreOrderImport' }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /pre-order-cars/bulk-update:
    patch:
      tags: [PreOrderCars]
      summary: Bulk update selected pre-order cars (staff only)
      description: Updates only the submitted customs and shipping/preparation fields for the selected cars.
      requestBody: { $ref: '#/components/requestBodies/JsonPreOrderCarsBulkUpdate' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /pre-order-cars/{preOrderCar}:
    parameters:
      - { name: preOrderCar, in: path, required: true, schema: { type: integer } }
    get: { tags: [PreOrderCars], summary: Show pre-order car with its requests and media, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    put: { tags: [PreOrderCars], summary: Update pre-order car, requestBody: { $ref: '#/components/requestBodies/JsonPreOrderCar' }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    delete: { tags: [PreOrderCars], summary: Delete pre-order car (blocked if has requests), responses: { '200': { $ref: '#/components/responses/Deleted' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /pre-order-cars/{preOrderCar}/publish:
    parameters:
      - { name: preOrderCar, in: path, required: true, schema: { type: integer } }
    post: { tags: [PreOrderCars], summary: Publish draft pre-order car (makes it visible to customers), responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } } }

  # ── طلبات العملاء المسبقة — المسارات المتداخلة (/pre-order-cars/{car}/requests/...) ──────
  /pre-order-cars/{preOrderCar}/requests:
    parameters:
      - { name: preOrderCar, in: path, required: true, schema: { type: integer } }
    get:
      tags: [PreOrderCarRequests]
      summary: List requests for a specific car with search & filter
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending, completed] } }
        - { name: customer_id, in: query, schema: { type: integer }, description: فلتر بمعرّف العميل }
        - { name: search, in: query, schema: { type: string }, description: بحث باسم أو هاتف العميل }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Paginated list of requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
    post:
      tags: [PreOrderCarRequests]
      summary: Create a pre-order request for a specific car (staff only)
      description: |
        السيارة يجب أن تكون منشورة (published_at ≠ null)، والطلب يتطلب customer_id موجودًا في النظام.
        لا يمكن لنفس العميل تقديم طلبين على نفس السيارة.
      requestBody: { $ref: '#/components/requestBodies/JsonPreOrderCarRequestBody' }
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /pre-order-cars/{preOrderCar}/requests/{preOrderCarRequest}:
    parameters:
      - { name: preOrderCar, in: path, required: true, schema: { type: integer } }
      - { name: preOrderCarRequest, in: path, required: true, schema: { type: integer } }
    get:
      tags: [PreOrderCarRequests]
      summary: Show a single pre-order request (nested route)
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
        '422': { description: Request does not belong to this car }
    put:
      tags: [PreOrderCarRequests]
      summary: Update request (notes / customer / status)
      description: تغيير customer_id ممنوع إذا كانت الحالة completed.
      requestBody: { $ref: '#/components/requestBodies/JsonPreOrderCarRequestUpdateBody' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [PreOrderCarRequests]
      summary: Delete request (only allowed while status = pending)
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /pre-order-cars/{preOrderCar}/requests/{preOrderCarRequest}/approve:
    parameters:
      - { name: preOrderCar, in: path, required: true, schema: { type: integer } }
      - { name: preOrderCarRequest, in: path, required: true, schema: { type: integer } }
    post:
      tags: [PreOrderCarRequests]
      summary: Approve request → status becomes completed
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /pre-order-cars/{preOrderCar}/requests/{preOrderCarRequest}/reject:
    parameters:
      - { name: preOrderCar, in: path, required: true, schema: { type: integer } }
      - { name: preOrderCarRequest, in: path, required: true, schema: { type: integer } }
    post:
      tags: [PreOrderCarRequests]
      summary: Reject request (currently disabled — always returns 422)
      responses: { '422': { $ref: '#/components/responses/ValidationError' } }

  # ── طلبات العملاء المسبقة — المسارات المسطّحة (/pre-order-car-requests) ─────────────────
  /pre-order-car-requests:
    get:
      tags: [PreOrderCarRequests]
      summary: List & search ALL pre-order requests across all cars
      description: |
        بحث شامل عبر كل الطلبات المسبقة بغض النظر عن السيارة.
        يمكن الجمع بين أي عدد من معاملات الفلترة والبحث.
      parameters:
        - { name: customer_id, in: query, schema: { type: integer }, description: فلتر مباشر بمعرّف العميل }
        - { name: pre_order_car_id, in: query, schema: { type: integer }, description: فلتر مباشر بمعرّف السيارة }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, completed]
          description: "draft = مسودة | pending = قيد الانتظار | completed = مكتمل"
        - name: search
          in: query
          schema: { type: string }
          description: |
            بحث نصي حر يشمل:
            - اسم العميل أو رقم هاتفه
            - ماركة السيارة أو موديلها أو finition
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Paginated list of pre-order requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
    post:
      tags: [PreOrderCarRequests]
      summary: Create a pre-order request (flat route — car ID in body)
      description: |
        إنشاء طلب مسبق جديد من المسار المسطّح.
        يجب إرسال `pre_order_car_id` كحقل في جسم الطلب.
        السيارة يجب أن تكون منشورة (published).
        لا يمكن لنفس العميل تقديم طلبين على نفس السيارة.
      requestBody: { $ref: '#/components/requestBodies/JsonPreOrderCarRequestBodyDirect' }
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /pre-order-car-requests/{preOrderCarRequest}:
    parameters:
      - { name: preOrderCarRequest, in: path, required: true, schema: { type: integer } }
    get:
      tags: [PreOrderCarRequests]
      summary: Show a single pre-order request (flat route — no car ID needed)
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [PreOrderCarRequests]
      summary: Update request (flat route)
      description: تغيير `customer_id` ممنوع إذا كانت الحالة `completed`.
      requestBody: { $ref: '#/components/requestBodies/JsonPreOrderCarRequestUpdateBody' }
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [PreOrderCarRequests]
      summary: Delete request (flat route — only allowed while status = pending)
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /pre-order-car-requests/{preOrderCarRequest}/approve:
    parameters:
      - { name: preOrderCarRequest, in: path, required: true, schema: { type: integer } }
    post:
      tags: [PreOrderCarRequests]
      summary: Approve request (flat route) → status becomes completed
      description: |
        يتحقق من أن السيارة المرتبطة بالطلب منشورة وأن حالة الطلب pending.
        يسجّل معرّف المستخدم الذي وافق (decided_by) وتاريخ الموافقة (decided_at).
      responses:
        '200':
          description: Approved request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/PreOrderCarRequestResource' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /contacts:
    get: { tags: [Contacts], summary: List contacts, parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/PerPage' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [Contacts], summary: Create contact, requestBody: { $ref: '#/components/requestBodies/JsonContact' }, responses: { '201': { $ref: '#/components/responses/Created' } } }
  /contacts/{contact}:
    parameters: [{ name: contact, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Contacts], summary: Show contact, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    put: { tags: [Contacts], summary: Update contact, requestBody: { $ref: '#/components/requestBodies/JsonContact' }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [Contacts], summary: Update contact, requestBody: { $ref: '#/components/requestBodies/JsonContact' }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    delete: { tags: [Contacts], summary: Delete contact, responses: { '200': { $ref: '#/components/responses/Deleted' } } }
