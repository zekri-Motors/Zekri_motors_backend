openapi: 3.0.3
info:
  title: Zekri Motors Backend API
  version: 1.2.0
  description: |
    ملف OpenAPI محدث حسب routes/api.php الحالي لاستخدامه في Bruno أو أي API client.

    طريقة العمل في Bruno:
    1. استورد هذا الملف.
    2. نفذ طلب `POST /auth/login`.
    3. احفظ قيمة `token` من الاستجابة في Runtime Variable باسم `token`.
    4. كل الطلبات المحمية تستخدم `Authorization: Bearer {{token}}`.

    سكربت Bruno المناسب في تبويب Post Response لطلب login:
    ```js
    bru.setVar("token", res.body.token);
    ```
servers:
  - url: http://localhost:8000/api
    description: Local Laravel server
  - url: https://your-domain.com/api
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Public
  - name: Suppliers
  - name: SupplierPayments
  - name: Batches
  - name: Cars
  - name: CarMedia
  - name: GeneralMedia
  - name: Tags
  - name: Contacts
  - name: ContainerOpeners
  - name: ServiceProviders
  - name: Customers
  - name: Agents
  - name: Orders
  - name: CustomerPayments
  - name: AgentTransactions
  - name: Expenses
  - name: Invoices
  - name: Dashboard
  - name: Treasury
  - name: Users
  - name: Settings
  - name: PreOrderCars
  - name: PreOrderCarRequests
    description: طلبات العملاء المسبقة — CRUD كامل مع بحث بالعميل والسيارة والحالة
  - name: Documents

x-bruno:
  auth:
    type: bearer
    token: "{{token}}"
  login:
    request: POST /auth/login
    postResponseScript: bru.setVar("token", res.body.token);

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: استخدم Bearer token الناتج من POST /auth/login. في Bruno ضع القيمة `{{token}}`.
      x-bruno:
        token: "{{token}}"
  parameters:
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, default: 15 } }
    Search: { name: search, in: query, schema: { type: string } }
  responses:
    Ok: { description: OK }
    Created: { description: Created }
    Deleted: { description: Deleted }
    Unauthenticated: { description: Unauthenticated }
    Forbidden: { description: Forbidden }
    NotFound: { description: Not found }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
  schemas:
    AnyJson: { type: object, additionalProperties: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: superadmin@example.com }
        password: { type: string, example: ChangeMe123! }
        device_name: { type: string, example: bruno }
    RegisterRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        national_id: { type: string, nullable: true }
        passport_no: { type: string, nullable: true }
        address: { type: string, nullable: true }
    LoginResponse:
      type: object
      properties:
        message: { type: string }
        user: { $ref: '#/components/schemas/AnyJson' }
        token: { type: string }
    PartyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    ServiceProviderRequest:
      allOf:
        - $ref: '#/components/schemas/PartyRequest'
        - type: object
          required: [provider_type]
          properties:
            provider_type: { type: string }
    ContactRequest:
      type: object
      required: [name, whatsapp_number]
      properties:
        name: { type: string }
        whatsapp_number: { type: string, example: "+213 555 12 34 56" }
        phone: { type: string, nullable: true, example: "+213 555 98 76 54" }
        address: { type: string, nullable: true }
        google_map_link: { type: string, format: uri, nullable: true, example: "https://maps.google.com/?q=..." }
    BatchRequest:
      type: object
      required: [supplier_id, cars]
      properties:
        supplier_id: { type: integer }
        container_opener_id: { type: integer, nullable: true }
        purchase_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [partial, fully_paid], nullable: true }
        notes: { type: string, nullable: true }
        cars:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BatchCarRequest'
    BatchCarRequest:
      type: object
      required: [brand, model, manufacture_year, foreign_purchase_price, customer_name, passport_no, national_id]
      properties:
        brand: { type: string }
        model: { type: string }
        finition: { type: string, nullable: true }
        manufacture_year: { type: integer }
        color: { type: string, nullable: true }
        vin: { type: string, nullable: true }
        foreign_purchase_price: { type: number }
        sale_price: { type: number, nullable: true }
        tracking_number: { type: string, nullable: true }
        customer_name: { type: string }
        passport_no: { type: string }
        national_id: { type: string }
        shipping_cost: { type: number, nullable: true }
        arrival_date: { type: string, format: date, nullable: true }
    CarRequest:
      type: object
      required: [batch_id, supplier_id, brand, model, manufacture_year, foreign_purchase_price, sale_price]
      properties:
        batch_id: { type: integer }
        supplier_id: { type: integer }
        container_opener_id: { type: integer, nullable: true }
        brand: { type: string }
        model: { type: string }
        finition: { type: string, nullable: true }
        manufacture_year: { type: integer }
        color: { type: string, nullable: true }
        vin: { type: string, nullable: true }
        foreign_purchase_price: { type: number }
        shipping_cost: { type: number, nullable: true }
        sale_price: { type: number }
        tracking_number: { type: string, nullable: true }
        container_no: { type: string, nullable: true }
        shipping_date: { type: string, format: date, nullable: true }
        arrival_date: { type: string, format: date, nullable: true }
        delivery_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [available, shipping, in_show_room, delivered, sold], nullable: true }
        notes: { type: string, nullable: true }
    CustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        national_id: { type: string, nullable: true }
        passport_no: { type: string, nullable: true }
        address: { type: string, nullable: true }
        agent_id: { type: integer, nullable: true }
    AgentRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        is_active: { type: boolean }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    OrderRequest:
      type: object
      required: [customer_id, car_id]
      properties:
        customer_id: { type: integer }
        car_id: { type: integer }
        agent_id: { type: integer, nullable: true }
        paid_amount: { type: number, nullable: true }
        purchase_date: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
    CustomerPaymentRequest:
      type: object
      required: [order_id, customer_id, amount, payment_date]
      properties:
        order_id: { type: integer }
        customer_id: { type: integer }
        amount: { type: number }
        agent_id: { type: integer, nullable: true }
        attachment: { type: string, nullable: true }
        payment_date: { type: string, format: date }
        notes: { type: string, nullable: true }
    AgentTransactionRequest:
      type: object
      required: [agent_id, direction, amount, transaction_date, notes]
      properties:
        agent_id: { type: integer }
        direction: { type: string, enum: [in, out] }
        amount: { type: number }
        transaction_date: { type: string, format: date }
        attachment: { type: string, nullable: true }
        notes: { type: string }
    PreOrderCarRequest:
      type: object
      required: [brand, model, manufacture_year, price, customs_fees]
      properties:
        brand: { type: string }
        model: { type: string }
        finition: { type: string, nullable: true }
        manufacture_year: { type: integer }
        color: { type: string, nullable: true }
        price: { type: number }
        customs_fees: { type: number }
        customs_fees_under_three: { type: number, nullable: true }
        preparation_days: { type: string, nullable: true }
        shipping_days: { type: string, nullable: true }
    PreOrderCarsBulkUpdateRequest:
      type: object
      required: [pre_order_car_ids]
      additionalProperties: false
      properties:
        pre_order_car_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer }
        customs_fees: { type: number, minimum: 0 }
        customs_fees_under_three: { type: number, minimum: 0 }
        preparation_days: { type: string, maxLength: 255 }
        shipping_days: { type: string, maxLength: 255 }
    # ── طلبات العملاء المسبقة ─────────────────────────────────────────
    PreOrderCarRequestBody:
      type: object
      required: [customer_id]
      properties:
        customer_id: { type: integer, description: معرّف العميل في النظام }
        notes: { type: string, nullable: true }
    PreOrderCarRequestBodyDirect:
      description: لإنشاء طلب من المسار المسطّح — يتضمن pre_order_car_id كحقل في الجسم
      type: object
      required: [pre_order_car_id, customer_id]
      properties:
        pre_order_car_id: { type: integer, description: معرّف سيارة الطلب المسبق }
        customer_id: { type: integer, description: معرّف العميل في النظام }
        notes: { type: string, nullable: true }
    PreOrderCarRequestUpdateBody:
      type: object
      properties:
        status:
          type: string
          enum: [draft, pending, completed]
          description: "draft = مسودة | pending = قيد الانتظار | completed = مكتمل"
        customer_id: { type: integer, nullable: true, description: "ممنوع تغييره إذا كان الطلب completed" }
        notes: { type: string, nullable: true }
    PreOrderCarRequestResource:
      type: object
      properties:
        id: { type: integer }
        pre_order_car_id: { type: integer }
        pre_order_car:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            brand: { type: string }
            model: { type: string }
            finition: { type: string, nullable: true }
            manufacture_year: { type: integer }
            color: { type: string, nullable: true }
            price: { type: number }
            is_published: { type: boolean }
        customer_id: { type: integer }
        customer:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            phone: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, pending, completed]
        notes: { type: string, nullable: true }
        decided_by: { type: integer, nullable: true }
        decided_by_user:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        decided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaUpdateRequest:
      type: object
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_cover: { type: boolean, nullable: true }
        sort_order: { type: integer, nullable: true }
        tags:
          type: array
          items: { type: string }

  requestBodies:
    JsonParty: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PartyRequest' } } } }
    JsonServiceProvider: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceProviderRequest' } } } }
    JsonContact: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactRequest' } } } }
    JsonBatch: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BatchRequest' } } } }
    JsonCar: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CarRequest' } } } }
    JsonCustomer: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequest' } } } }
    JsonAgent: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentRequest' } } } }
    JsonOrder: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderRequest' } } } }
    JsonCustomerPayment: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPaymentRequest' } } } }
    JsonAgentTransaction: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentTransactionRequest' } } } }
    JsonPreOrderCar: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreOrderCarRequest' } } } }
    JsonPreOrderCarsBulkUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreOrderCarsBulkUpdateRequest' } } } }
    JsonPreOrderCarRequestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreOrderCarRequestBody' } } } }
    JsonPreOrderCarRequestBodyDirect: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreOrderCarRequestBodyDirect' } } } }
    JsonPreOrderCarRequestUpdateBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreOrderCarRequestUpdateBody' } } } }
    JsonMediaUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaUpdateRequest' } } } }
    BatchImport:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [supplier_id, file]
            properties:
              supplier_id: { type: integer }
              container_opener_id: { type: integer, nullable: true }
              purchase_date: { type: string, format: date, nullable: true }
              total_cost_foreign: { type: number, nullable: true }
              notes: { type: string, nullable: true }
              file: { type: string, format: binary }
    PreOrderImport:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
    MediaUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            description: أرسل media_ids لإرفاق صور موجودة، أو أرسل واحدًا فقط من file أو url لإنشاء ميديا جديدة.
            properties:
              media_ids:
                type: array
                minItems: 1
                items: { type: integer }
                description: مصفوفة معرّفات صور موجودة في car_media
              file: { type: string, format: binary, nullable: true }
              url: { type: string, format: uri, nullable: true }
              type: { type: string, enum: [image, video], nullable: true }
              title: { type: string, nullable: true }
              description: { type: string, nullable: true }
              is_cover: { type: boolean, nullable: true }
              sort_order: { type: integer, nullable: true }
              tags: { type: array, items: { type: string } }
    Expense:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [expense_type, amount, expense_date]
            properties:
              car_id: { type: integer, nullable: true }
              order_id: { type: integer, nullable: true }
              service_provider_id: { type: integer, nullable: true }
              expense_type: { type: string }
              amount: { type: number }
              attachment: { type: string, format: binary, nullable: true }
              expense_date: { type: string, format: date }
              notes: { type: string, nullable: true }

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register public customer profile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login and get Sanctum token
      description: ضع سكربت Bruno Post Response `bru.setVar("token", res.body.token);`.
      x-bruno:
        postResponseScript: bru.setVar("token", res.body.token);
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Login success, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get: { tags: [Auth], summary: Current user, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /auth/logout:
    post: { tags: [Auth], summary: Logout current token, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /auth/logout-all:
    post: { tags: [Auth], summary: Logout all tokens, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /auth/update-password:
    post: &updatePassword
      tags: [Auth]
      summary: Update password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    put: *updatePassword
  /auth/update-profile:
    post: &updateProfile
      tags: [Auth]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string, nullable: true }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    put: *updateProfile
  /ping:
    get: { tags: [Auth], summary: Auth ping, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /lookup/customer/{passport_no}:
    get:
      tags: [Public]
      security: []
      summary: Public customer lookup by passport path param
      parameters: [{ name: passport_no, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /lookup/customer:
    get:
      tags: [Public]
      security: []
      summary: Public customer lookup by query
      parameters: [{ name: passport_no, in: query, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /cars/available:
    get:
      tags: [Public, Cars]
      security: []
      summary: Public available cars catalogue
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /suppliers:
    get: { tags: [Suppliers], summary: List suppliers, parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/Page' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [Suppliers], summary: Create supplier, requestBody: { $ref: '#/components/requestBodies/JsonParty' }, responses: { '201': { $ref: '#/components/responses/Created' } } }
  /suppliers/{supplier}:
    parameters: [{ name: supplier, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Suppliers], summary: Show supplier, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    put: { tags: [Suppliers], summary: Update supplier, requestBody: { $ref: '#/components/requestBodies/JsonParty' }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [Suppliers], summary: Update supplier, requestBody: { $ref: '#/components/requestBodies/JsonParty' }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    delete: { tags: [Suppliers], summary: Delete supplier, responses: { '200': { $ref: '#/components/responses/Deleted' } } }
  /supplier-payments:
    get: { tags: [SupplierPayments], summary: List supplier payments, parameters: [{ name: supplier_id, in: query, schema: { type: integer } }, { name: batch_id, in: query, schema: { type: integer } }, { $ref: '#/components/parameters/PerPage' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post:
      tags: [SupplierPayments]
      summary: Create supplier payment and distribute it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, amount_foreign, exchange_rate, payment_date]
              properties:
                supplier_id: { type: integer }
                batch_id: { type: integer, nullable: true }
                amount_foreign: { type: number }
                exchange_rate: { type: number }
                payment_date: { type: string, format: date }
                notes: { type: string, nullable: true }
      responses: { '201': { $ref: '#/components/responses/Created' } }
  /supplier-payments/{supplier_payment}:
    parameters: [{ name: supplier_payment, in: path, required: true, schema: { type: integer } }]
    get: { tags: [SupplierPayments], summary: Show supplier payment, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    put: { tags: [SupplierPayments], summary: Update supplier payment, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [SupplierPayments], summary: Update supplier payment, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    delete: { tags: [SupplierPayments], summary: Delete supplier payment, responses: { '200': { $ref: '#/components/responses/Deleted' } } }
  /batches:
    get: { tags: [Batches], summary: List batches, parameters: [{ $ref: '#/components/parameters/PerPage' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [Batches], summary: Create batch, requestBody: { $ref: '#/components/requestBodies/JsonBatch' }, responses: { '201': { $ref: '#/components/responses/Created' } } }
  /batches/import:
    post: { tags: [Batches], summary: Import batch cars from xlsx/xls/csv, requestBody: { $ref: '#/components/requestBodies/BatchImport' }, responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /batches/{batch}:
    parameters: [{ name: batch, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Batches], summary: Show batch, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    put: { tags: [Batches], summary: Update batch, requestBody: { $ref: '#/components/requestBodies/JsonBatch' }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [Batches], summary: Update batch, requestBody: { $ref: '#/components/requestBodies/JsonBatch' }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    delete: { tags: [Batches], summary: Delete batch, responses: { '200': { $ref: '#/components/responses/Deleted' } } }
  /cars:
    get: { tags: [Cars], summary: List cars, parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/PerPage' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
